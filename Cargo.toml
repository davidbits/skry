[package]
name = "skry"
version = "0.1.0"
edition = "2021"
authors = ["David Young"]
description = "A deterministic, LSP-powered context assembler for LLMs"
license = "MIT"
repository = "https://github.com/davidbits/skry"
readme = "README.md"

[dependencies]
# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Configuration parsing (TOML)
toml = "0.9.10"
serde = { version = "1.0", features = ["derive"] }

# LSP and JSON-RPC
lsp-types = "0.97.0"
lsp-server = "0.7"
serde_json = "1.0"

# Async runtime for managing LSP subprocesses
tokio = { version = "1.35", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0.17"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lib]
name = "skry"
path = "src/lib.rs"

[[bin]]
name = "skry"
path = "src/main.rs"
